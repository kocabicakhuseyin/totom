name: Totom APK - Build and Tests Separate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK derle ve yukle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadi: $SDK_ROOT"
            exit 1
          fi
          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 9.3.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: APK derle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace --console=plain
      - name: APK dosyasini Artifacts'a yukle
        uses: actions/upload-artifact@v4
        with:
          name: Totom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Birim testleri (APK'dan bagimsiz)
    needs: apk
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager bulunamadi: $SDK_ROOT"
            exit 1
          fi
          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Birim testlerini calistir
        run: gradle --no-daemon --no-configuration-cache :app:testDebugUnitTest --stacktrace --console=plain
      - name: Test raporunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Totom-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
