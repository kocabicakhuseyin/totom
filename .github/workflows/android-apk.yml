name: Totom APK - Build and Tests Separate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK derle ve yukle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Android API 36 paketlerini kur
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 9.3.1 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Debug imza anahtari hazirla
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: APK derle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug --stacktrace --console=plain
      - name: APK dosyasini Artifacts'a yukle
        uses: actions/upload-artifact@v4
        with:
          name: Totom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Birim testleri (APK'dan bagimsiz)
    needs: apk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: SDK paketleri
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Birim testlerini calistir
        run: gradle --no-daemon --no-configuration-cache :app:testDebugUnitTest --stacktrace --console=plain
      - name: Test raporunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Totom-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
